# Spreadsheet-triggered test runs (see SheetRunnerAgent / RUNNING_TESTS.md)
sheet.spreadsheetId=1amCnHIC-9VY44ClOR4hT4AEV3tSjl7dvp_mgnCC2_L0
sheet.credentialsPath=Config/service-account.json
sheet.pollIntervalSeconds=15
# Comma-separated tab names to wire up/poll. Keep this to only the tabs that actually have
# automated tests behind them (see TestData/TestCaseAutomationMap.csv) - the spreadsheet has 30+
# other tabs, and polling all of them would blow through the Sheets API's 60-reads/minute quota.
sheet.watchedTabs=Login
# Test class that "RUN ENTIRE SUITE" (the checkbox one row above the header) runs for each
# watched tab - one property per tab, named sheet.suiteClass.<TabName>.
sheet.suiteClass.Login=LoginTest
# Local port the agent serves reports/ on, so REPORT links in the sheet open over http:// instead
# of file:// (which most browsers block navigating to from an https: page like Google Sheets).
sheet.reportServerPort=8787
